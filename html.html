<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 800px;
            min-height: 450px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .left {
            width: 50%;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        .left h1 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .left p {
            line-height: 1.6;
        }

        .right {
            width: 50%;
            padding: 40px;
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #4c5fd5;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .switch a {
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
        }

        #registerForm {
            display: none;
        }

        @media (max-width: 700px) {
            .container {
                width: 90%;
                flex-direction: column;
            }

            .left, .right {
                width: 100%;
            }

            .left {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Left Side -->
        <div class="left">
            <h1>Welcome!</h1>
            <p>
                Login to your account or create a new account
                to get started.
            </p>
        </div>

        <!-- Right Side -->
        <div class="right">

            <!-- Login Form -->
            <div class="form-box" id="loginForm">
                <h2>Login</h2>

                <div class="input-box">
                    <input type="email" placeholder="Enter Email">
                </div>

                <div class="input-box">
                    <input type="password" placeholder="Enter Password">
                </div>

                <button class="btn">Login</button>

                <div class="switch">
                    Don't have an account?
                    <a onclick="showRegister()">Register</a>
                </div>
            </div>

            <!-- Registration Form -->
            <div class="form-box" id="registerForm">
                <h2>Registration</h2>

                <div class="input-box">
                    <input type="text" placeholder="Enter Name">
                </div>

                <div class="input-box">
                    <input type="email" placeholder="Enter Email">
                </div>

                <div class="input-box">
                    <input type="password" placeholder="Create Password">
                </div>

                <div class="input-box">
                    <input type="password" placeholder="Confirm Password">
                </div>

                <button class="btn">Register</button>

                <div class="switch">
                    Already have an account?
                    <a onclick="showLogin()">Login</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        function showRegister() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("registerForm").style.display = "block";
        }

        function showLogin() {
            document.getElementById("registerForm").style.display = "none";
            document.getElementById("loginForm").style.display = "block";
        }
    </script>

</body>
</html>
